<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Outer Circular Recycling Flow -->
  <circle cx="32" cy="32" r="30" fill="#163A5F"/>
  <circle cx="32" cy="32" r="28" stroke="#C6A15B" stroke-width="2" stroke-dasharray="3 2" opacity="0.5"/>
  
  <!-- Recycling Arrows -->
  <path d="M32 6 A26 26 0 0 1 54 22" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
  <polygon points="57,26 50,21 57,17" fill="#FFFFFF"/>

  <path d="M54 42 A26 26 0 0 1 16 52" stroke="#C6A15B" stroke-width="3.5" stroke-linecap="round"/>
  <polygon points="11,48 18,54 20,46" fill="#C6A15B"/>

  <path d="M10 32 A26 26 0 0 1 24 8" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
  <polygon points="27,3 25,12 33,8" fill="#FFFFFF"/>

  <!-- Inner Badge & Weighing Scale -->
  <circle cx="32" cy="32" r="18" fill="#FFFFFF"/>

  <!-- Scale Beam -->
  <path d="M20 28 H44" stroke="#163A5F" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Scale Center Pillar -->
  <path d="M32 22 V38 M26 39 H38" stroke="#C6A15B" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="32,24 29,28 35,28" fill="#163A5F"/>

  <!-- Scale Dishes -->
  <path d="M22 28 L18 34 M22 28 L26 34 M16 34 H28" stroke="#163A5F" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M42 28 L38 34 M42 28 L46 34 M36 34 H48" stroke="#163A5F" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Scrap Blocks -->
  <rect x="19" y="35" width="6" height="4" rx="1" fill="#C6A15B"/>
  <rect x="39" y="35" width="6" height="4" rx="1" fill="#C6A15B"/>
</svg>
